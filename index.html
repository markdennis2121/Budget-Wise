<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Budget App</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet" />

  <style>
    body, html, #root { margin:0; padding:0; height:100%; font-family: 'Inter', sans-serif; }
